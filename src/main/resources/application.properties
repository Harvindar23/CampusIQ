spring.application.name=CampusIQ
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/campusiq}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

platform.leetcode.base-url=https://alfa-leetcode-api.onrender.com
platform.codeforces.base-url=https://codeforces.com
platform.codechef.base-url=https://www.codechef.com
platform.geeksforgeeks.base-url=https://gfg-stats.tashif.codes
